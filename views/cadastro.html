<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Tenda do Pastel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .bg-brand-blue { background-color: #0d1b2a; }
        body { display: flex; flex-direction: column; min-height: 100vh; background-color: #f8f9fa; }
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 15px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-danger shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
                <span style="font-size: 1.5rem;">🥟</span> 
                <span>Tenda do Pastel <small class="text-white-50" style="font-size: 0.8rem; display:block;">Carapicuíba</small></span>
            </a>
            <a href="/" class="btn btn-outline-light btn-sm fw-bold px-3" style="border-radius: 8px;">
                <i class="fa-solid fa-house me-1"></i> Início
            </a>
        </div>
    </nav>

    <main class="main-content">
        <div class="card shadow-sm border-0 p-4 w-100" style="max-width: 500px; border-radius: 20px; background: #ffffff;">
            <h3 class="text-center fw-bold mb-4 text-dark">Novo Cadastro</h3>
            
            <form id="formCadastro">
                <div class="mb-3">
                    <label class="form-label fw-bold text-dark small mb-1">Nome Completo</label>
                    <input type="text" id="nome" class="form-control bg-light" required style="border-radius: 8px;">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold text-dark small mb-1">Email</label>
                    <input type="email" id="email" class="form-control bg-light" placeholder="ex: seuemail@dominio.com" required style="border-radius: 8px;">
                </div>
                <div class="row">
                    <div class="col-md-5 mb-3">
                        <label class="form-label fw-bold text-dark small mb-1">Telefone / WhatsApp</label>
                        <input type="text" id="telefone" class="form-control bg-light" placeholder="(11) 90000-0000" required style="border-radius: 8px;">
                    </div>
                    <div class="col-md-7 mb-3">
                        <label class="form-label fw-bold text-dark small mb-1">Senha (Mín. 6 dígitos)</label>
                        <input type="password" id="senha" class="form-control bg-light" required style="border-radius: 8px;">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark small mb-1">Endereço Completo para Entrega</label>
                    <input type="text" id="endereco" class="form-control bg-light" placeholder="Rua, Número, Bairro" required style="border-radius: 8px;">
                </div>
                
                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold shadow-sm" style="border-radius: 10px; font-size: 1.1rem;">
                    Criar Minha Conta
                </button>
            </form>
            
            <p class="mt-4 text-center text-muted small">Já é cliente? <br><a href="/login" class="text-danger fw-bold text-decoration-none">Fazer Login</a></p>
        </div>
    </main>

    <footer class="bg-brand-blue py-4 mt-auto text-center border-top border-secondary">
        <div class="container">
            <p class="text-light mb-1 fw-medium" style="font-size: 0.95rem; letter-spacing: 0.5px;">
                © 2024 Tenda do Pastel - Carapicuíba/SP
            </p>
            <p class="text-muted small mb-0">Projeto Integrador FATEC - Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const telefone = document.getElementById('telefone').value;
            const endereco = document.getElementById('endereco').value;

            // VALIDAÇÕES COM SWEETALERT (Adeus alerts feios!)
            if (nome.length < 3) return Swal.fire('Atenção', 'Por favor, digite seu nome completo.', 'warning');
            if (!email.includes("@") || !email.includes(".")) return Swal.fire('Atenção', 'Insira um e-mail válido.', 'warning');
            if (senha.length < 6) return Swal.fire('Atenção', 'A senha deve ter pelo menos 6 caracteres.', 'warning');

            const dados = { nome, email, telefone, endereco, senha };

            Swal.fire({ title: 'A criar conta...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            fetch('/api/cadastro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            })
            .then(res => res.json())
            .then(data => {
                if (data.sucesso) {
                    Swal.fire({
                        title: 'Cadastro Realizado! 🎉',
                        text: 'A sua conta foi criada. Pode fazer o login agora.',
                        icon: 'success',
                        confirmButtonColor: '#dc3545'
                    }).then(() => {
                        window.location.href = '/login';
                    });
                } else {
                    Swal.fire('Ops!', data.mensagem || 'Ocorreu um erro no cadastro.', 'error');
                }
            })
            .catch(err => Swal.fire('Erro de Conexão', 'Não foi possível comunicar com o servidor.', 'error'));
        });
    </script>
</body>
</html>
